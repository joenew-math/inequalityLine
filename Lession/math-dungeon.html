<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>地城連擊 v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07050f;color:#f3ecff;
  font-family:"Noto Sans TC",system-ui,sans-serif;touch-action:none;user-select:none}
.px{font-family:"Press Start 2P"}
.hide{display:none!important}

/* ================= DUNGEON ================= */
/* ===== 辟邪除妖式：框住的視窗 + 石造面板 ===== */
#dungeon{position:fixed;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#161028,#0a0716)}
#viewFrame{position:relative;margin:8px 8px 0;flex:1;min-height:0;
  border:3px solid #8a6f2a;border-radius:3px;
  background:#000;box-shadow:0 0 0 3px #2a1f0d,0 0 0 5px #6b5320,
    inset 0 0 0 2px #47391a,0 6px 18px rgba(0,0,0,.7);overflow:hidden}
#screen{image-rendering:pixelated;width:100%;height:100%;object-fit:cover;display:block;transition:transform .07s}
/* 四角裝飾釘 */
#viewFrame::before,#viewFrame::after{content:"";position:absolute;width:9px;height:9px;
  background:radial-gradient(circle at 35% 30%,#ffe38a,#8a6f2a);border-radius:50%;z-index:3}
#viewFrame::before{top:4px;left:4px;box-shadow:0 0 0 1px #2a1f0d}
#viewFrame::after{top:4px;right:4px;box-shadow:0 0 0 1px #2a1f0d}

/* 羅盤 */
#compass{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;
  width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,14,42,.92),rgba(8,5,18,.95));
  border:2px solid #8a6f2a;box-shadow:0 0 0 2px #2a1f0d,inset 0 0 12px rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center}
#compass .dir{font-size:20px;font-weight:900;color:#ffe38a;text-shadow:0 2px 0 #4a3608}
#compass .tick{position:absolute;font-size:7px;color:#7d6f9e;font-weight:900}
#compass .n{top:2px;left:50%;transform:translateX(-50%);color:#ff8a8a}
#compass .s{bottom:2px;left:50%;transform:translateX(-50%)}
#compass .e{right:3px;top:50%;transform:translateY(-50%)}
#compass .w{left:3px;top:50%;transform:translateY(-50%)}

/* 底部石造狀態列 */
#stonePanel{flex:0 0 auto;margin:6px 8px 8px;padding:8px 10px;
  border:3px solid #8a6f2a;border-radius:3px;
  background:linear-gradient(180deg,#2f2545,#1b142f);
  box-shadow:0 0 0 3px #2a1f0d,inset 0 1px 0 rgba(255,220,140,.18);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#stonePanel .meter{width:84px}
#manaTag{font-size:10px;font-weight:900;color:#8fd0ff;border:2px solid #3f5a8a;
  border-radius:3px;padding:3px 7px;background:rgba(63,127,208,.12)}
#restTag{font-size:10px;font-weight:900;color:#a9efc2;border:2px solid #376e50;
  border-radius:3px;padding:3px 7px;background:rgba(57,142,91,.14);white-space:nowrap}
#restTag.warn{color:#ffe36e;border-color:#c98d22;background:rgba(255,172,42,.16);animation:restPulse .8s steps(2,end) infinite}
#restTag.danger{color:#ff8d8d;border-color:#d94343;background:rgba(220,45,45,.2);animation:restPulse .35s steps(2,end) infinite}
@keyframes restPulse{50%{filter:brightness(1.8);transform:scale(1.04)}}
.health-wind{position:relative;overflow:hidden;padding:10px 0 4px;text-align:center}
.health-wind .wind{font-size:64px;line-height:1;display:block;filter:drop-shadow(0 0 12px #b8efff);
  animation:windSweep .55s ease-in-out infinite alternate}
.health-wind .student{font-size:46px;display:block;animation:windBlown 1.1s ease-in infinite}
.health-count{font:900 28px/1.2 monospace;color:#ffe36e;text-align:center;margin:10px 0}
@keyframes windSweep{from{transform:translateX(-18px) skewX(-8deg)}to{transform:translateX(18px) skewX(8deg)}}
@keyframes windBlown{0%{transform:translateX(-20px) rotate(-5deg)}100%{transform:translateX(180px) rotate(28deg);opacity:.2}}
#mini{position:absolute;top:6px;right:6px;z-index:6;image-rendering:pixelated;
  border:2px solid #a8801f;box-shadow:0 0 0 2px #07050f;background:rgba(7,5,15,.8)}
.tag{font-size:9px;color:#07050f;background:#ecc24e;padding:5px 6px;border-radius:3px;box-shadow:0 3px 0 #a8801f}
.meter{width:86px}
.meter .l{font-size:9px;color:#a99ec9;letter-spacing:1px;margin-bottom:2px}
.bar{height:11px;background:#1a1030;border:2px solid #000;box-shadow:inset 0 0 0 1px #4a3b73;position:relative}
.bar i{display:block;height:100%;transition:width .2s}
.hpf{background:linear-gradient(180deg,#7ee06a,#3f9e2f)}
.hpf.low{background:linear-gradient(180deg,#ff7b6b,#c53f3f)}
.xpf{background:linear-gradient(180deg,#8fd0ff,#3f7fd0)}
.bar b{position:absolute;inset:0;text-align:center;font-size:8px;line-height:8px;color:#fff;
  text-shadow:0 1px 2px #000;font-weight:900}
#lvl{font-size:11px;font-weight:900;color:#8fd0ff}
#keyi{font-size:10px;font-weight:900;color:#ecc24e;border:2px solid #5a4512;border-radius:3px;
  padding:4px 6px;opacity:.25;transition:.2s}
#keyi.on{opacity:1;border-color:#ecc24e;box-shadow:0 0 10px rgba(236,194,78,.6)}
#turnN{position:absolute;top:6px;left:8px;transform:none;z-index:6;font-size:9px;color:#6f6490;letter-spacing:2px}
#alertBanner{position:absolute;top:66px;left:0;right:0;text-align:center;z-index:6;pointer-events:none;
  font-size:13px;font-weight:900;color:#ff6a6a;letter-spacing:3px;
  text-shadow:0 2px 0 #4a0d0d,0 0 14px rgba(255,60,60,.7);opacity:0;transition:.2s}
#alertBanner.on{opacity:1}
#gesture{position:absolute;inset:0;z-index:4}
#strafeL,#strafeR{position:absolute;top:34%;height:32%;width:56px;z-index:7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(90deg,rgba(58,44,96,.62),rgba(36,26,68,.28));
  border:2px solid rgba(168,128,31,.5);color:#ecc24e;cursor:pointer}
#strafeL{left:0;border-left:none;border-radius:0 8px 8px 0}
#strafeR{right:0;border-right:none;border-radius:8px 0 0 8px;
  background:linear-gradient(270deg,rgba(58,44,96,.62),rgba(36,26,68,.28))}
#strafeL:active,#strafeR:active{background:rgba(236,194,78,.32)}
#strafeL .ar,#strafeR .ar{font-size:22px;line-height:1}
#strafeL .lb,#strafeR .lb{font-size:9px;font-weight:900;color:#cbbde8;letter-spacing:1px}
#swapBtn,#deckBtn,#waitBtn,#mapBtn{margin-left:6px;
  font-family:"Noto Sans TC";font-weight:900;font-size:11px;letter-spacing:2px;color:#3a2708;
  background:linear-gradient(180deg,#f0cf78,#c98a3c);border:2px solid #6b4f12;border-radius:5px;
  padding:9px 18px;box-shadow:0 4px 0 #5a3f0d;cursor:pointer}
#swapBtn:active,#deckBtn:active,#waitBtn:active,#mapBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3f0d}
/* ═══ 全螢幕大地圖 ═══ */
#bigMap{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(5,3,12,.85);backdrop-filter:blur(2px)}
#bigMapCard{max-width:min(94vw,520px);max-height:94%;overflow:auto;
  border:3px solid #8a6f2a;border-radius:6px;padding:10px 12px 12px;
  background:linear-gradient(180deg,#241b45,#140e2c);
  box-shadow:0 0 0 3px #2a1f0d,0 12px 40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,220,140,.15)}
#bigMapHead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#bigMapHead b{font-size:12px;color:#ffe38a;letter-spacing:2px}
#bigMapPct{font-size:10px;font-weight:900;color:#8fd0ff;margin-left:auto;
  border:2px solid #3f5a8a;border-radius:3px;padding:3px 8px;background:rgba(63,127,208,.12)}
#bigMapClose{font-family:inherit;font-weight:900;font-size:12px;color:#ffb0a0;cursor:pointer;
  background:rgba(197,63,63,.2);border:2px solid #7a3030;border-radius:4px;padding:4px 10px}
#bigMapCv{display:block;width:100%;image-rendering:pixelated;
  border:2px solid #5a4512;background:#0b0718;box-shadow:inset 0 0 24px rgba(0,0,0,.7)}
#bigMapLegend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px}
#bigMapLegend .li{display:flex;align-items:center;gap:5px;font-size:10px;color:#cbbde8;font-weight:700}
#bigMapLegend .sw{width:10px;height:10px;border-radius:2px;box-shadow:0 0 0 1px #07050f}
#bigMapHint{margin-top:8px;font-size:9px;color:#6f6490;letter-spacing:1px;text-align:center}
#mini{cursor:pointer}
#swipeHint{position:absolute;bottom:8px;left:0;right:0;text-align:center;z-index:5;
  font-size:10px;color:#6f6490;pointer-events:none;line-height:1.6}
#toast{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;width:max-content;max-width:min(92vw,720px);
  transform:translate(-50%,-12px);text-align:center;font-size:14px;font-weight:900;line-height:1.45;
  color:#ffe684;background:rgba(19,13,31,.94);border:2px solid #ecc24e;border-radius:8px;
  box-shadow:0 5px 0 rgba(0,0,0,.55),0 0 16px rgba(236,194,78,.35);opacity:0;transition:.22s;
  z-index:260;pointer-events:none;padding:8px 14px}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= BATTLE (太空戰士式) ================= */
#battle{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#05040c}
#battle.enter{animation:bIn .5s ease-out}
@keyframes bIn{0%{opacity:0;transform:scale(1.35)}55%{opacity:1}100%{transform:none}}
#flashFx{position:fixed;inset:0;z-index:60;background:#fff;pointer-events:none;opacity:0}
#flashFx.go{animation:fl .42s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}

/* 上半：戰場 */
#field{position:relative;flex:1;min-height:245px;overflow:hidden}
#fieldBg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#reinfBar{position:absolute;top:0;left:0;right:0;z-index:4;padding:6px 9px;
  background:linear-gradient(180deg,rgba(5,4,12,.9),transparent)}
#reinfBar.hide{display:none}
#reinfBar .rh{display:flex;align-items:center;gap:7px;font-size:11px;color:#ff8a5a;
  letter-spacing:1px;font-weight:900}
#reinfBar .rItem b{font-size:13px;color:#fff;margin:0 2px}
#reinfBar .rh b{color:#ff8a5a;font-weight:900}
#rClock{flex:1;height:5px;background:#1a1030;border:1px solid #000;overflow:hidden}
#rClock i{display:block;height:100%;background:linear-gradient(90deg,#57b6ea,#e26bd6);width:0%}
#rList{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.rItem{font-size:9px;font-weight:900;padding:2px 6px;border-radius:3px;
  background:rgba(255,106,106,.14);border:1px solid #7a2020;color:#ff9a9a}
.rItem.near{background:rgba(255,60,60,.3);border-color:#ff3b3b;color:#fff;animation:blink .55s infinite}
@keyframes blink{50%{opacity:.4}}
.rNone{font-size:9px;color:#5a527a}

/* 敵人陣型：絕對定位，隨數量往左右擴散並縮小 */
.foe{position:absolute;transform-origin:50% 100%;cursor:pointer;
  transition:left .38s cubic-bezier(.2,.9,.3,1),top .38s,width .38s,opacity .3s}
.foe canvas{width:100%;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.5))}
/* 靜態母圖以輕量 CSS 製造不同種族的呼吸動態；不需下載 GIF 或同步影格。 */
.foe:not(.acting).motion-hover .monsterSprite{animation:monsterIdleHover 1.55s ease-in-out infinite}
.foe:not(.acting).motion-skitter .monsterSprite{animation:monsterIdleSkitter 1.15s steps(4) infinite}
.foe:not(.acting).motion-coil .monsterSprite{animation:monsterIdleCoil 1.8s ease-in-out infinite}
.foe:not(.acting).motion-stomp .monsterSprite{animation:monsterIdleStomp 1.45s steps(4) infinite}
.foe:not(.acting).motion-bounce .monsterSprite{animation:monsterIdleBounce 1.35s ease-in-out infinite}
.foe:not(.acting).motion-pounce .monsterSprite{animation:monsterIdlePounce 1.6s ease-in-out infinite}
@keyframes monsterIdleHover{0%,100%{transform:translateY(2px) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg);filter:brightness(1.08)}}
@keyframes monsterIdleSkitter{0%,100%{transform:translateX(-1px) translateY(1px)}25%{transform:translateX(2px)}50%{transform:translateX(-2px) translateY(-2px)}75%{transform:translateX(1px)}}
@keyframes monsterIdleCoil{0%,100%{transform:scaleX(.98) rotate(-1.5deg)}50%{transform:scaleX(1.03) translateY(-3px) rotate(1.5deg)}}
@keyframes monsterIdleStomp{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scaleY(1.02)}}
@keyframes monsterIdleBounce{0%,100%{transform:translateY(1px) scale(1,.98)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes monsterIdlePounce{0%,100%{transform:translateY(1px) scale(1)}55%{transform:translateY(-2px) scale(1.015)}}
.foe.arrive{animation:arrIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes arrIn{0%{opacity:0;transform:translateY(-40px) scale(.4)}100%{opacity:1;transform:none}}
.foe.hurt{animation:hurtShake .22s}
@keyframes hurtShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.foe.dying{animation:die .45s forwards}
@keyframes die{100%{opacity:0;transform:translateY(6px) scale(.7)}}
.foe .fbar{height:11px;background:#140b12;border:1px solid #000;margin-top:2px;
  position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.foe .fbar::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 8px,
    rgba(0,0,0,.55) 8px,rgba(0,0,0,.55) 10px)}
.foe .fnum{position:absolute;left:0;right:0;top:-13px;text-align:center;
  font-family:"Press Start 2P";font-size:8px;color:#fff;
  text-shadow:0 1px 0 #000,0 0 4px #000;pointer-events:none}
.foe .fbar i{display:block;height:100%;background:linear-gradient(180deg,#ff6a6a,#a01f1f);transition:width .2s}
.foe .fnm{font-size:8px;font-weight:900;text-align:center;color:#e8e0ff;
  text-shadow:0 1px 2px #000;white-space:nowrap;margin-top:2px}
.foe .fint{font-size:8px;font-weight:900;text-align:center;color:#ff9a5a;text-shadow:0 1px 2px #000}
.foe.sel .fnm{color:#ffe38a}
.foeSpeech{position:absolute;z-index:48;max-width:min(280px,72vw);padding:8px 11px;
  border:2px solid #171221;border-radius:10px;background:rgba(255,252,232,.94);color:#22192d;
  font-size:12px;font-weight:900;line-height:1.35;text-align:center;pointer-events:none;
  box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 16px rgba(255,227,138,.28);
  transform:translate(-50%,-100%);animation:selTalk 2.7s ease-out forwards}
.foeSpeech::after{content:'';position:absolute;left:50%;bottom:-9px;width:13px;height:13px;
  background:rgba(255,252,232,.94);border-right:2px solid #171221;border-bottom:2px solid #171221;
  transform:translateX(-50%) rotate(45deg)}
.foeSpeech b{color:#8d3b2a}
@keyframes selTalk{0%{opacity:0;transform:translate(-50%,-88%) scale(.72)}
  12%,78%{opacity:1;transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-112%) scale(.96)}}
.cursor{position:absolute;font-size:15px;color:#ffe38a;text-shadow:0 2px 0 #7a5510;
  animation:bobc .7s infinite alternate;pointer-events:none}
@keyframes bobc{100%{transform:translateY(-5px)}}
/* 後排：站遠一點、暗一點、不能被單體指定 */
.foe.back canvas{filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)) brightness(.72) saturate(.8)}
.foe.back .fnm{color:#9f96c4}
.foe.locked{cursor:not-allowed}
.foe .rowTag{position:absolute;top:-2px;right:-2px;font-size:7px;font-weight:900;
  padding:1px 3px;border-radius:2px;background:#2a2050;border:1px solid #6a5aa0;color:#bfb3e8}
.foe.front .rowTag{background:#4a1520;border-color:#a03040;color:#ffb3b3}
.foe.advance{animation:adv .5s cubic-bezier(.3,1.3,.4,1)}
@keyframes adv{0%{transform:translateY(-16px) scale(.85);filter:brightness(2)}100%{transform:none}}

/* Boss 登場演出 */
#bossCut{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(60% 60% at 50% 45%,rgba(90,10,20,.55),rgba(4,2,8,.96))}
#bossCut canvas{width:min(48vmin,320px);image-rendering:pixelated;
  filter:drop-shadow(0 0 26px rgba(255,60,60,.75));animation:bossIn .8s cubic-bezier(.2,1.3,.35,1)}
@keyframes bossIn{0%{transform:scale(.2) translateY(50px);opacity:0}
  60%{transform:scale(1.14);opacity:1}100%{transform:none}}
#bossCut .bn{margin-top:14px;font-size:26px;font-weight:900;color:#ff5a5a;letter-spacing:6px;
  text-shadow:0 3px 0 #4a0808,0 0 22px rgba(255,60,60,.85);animation:nameIn .6s .35s both}
#bossCut .bs{margin-top:6px;font-family:"Press Start 2P";font-size:9px;color:#ffd08a;
  letter-spacing:2px;animation:nameIn .6s .55s both}
@keyframes nameIn{0%{opacity:0;letter-spacing:22px}100%{opacity:1}}
#bossCut.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-7px,4px)}
  45%{transform:translate(6px,-4px)}70%{transform:translate(-4px,-3px)}}

/* 怪物出手可跨越整個戰鬥介面；只重用一張 32px 像素圖，不增加大量動畫素材。 */
#battleFullFx{position:fixed;inset:0;z-index:54;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;overflow:hidden;background:radial-gradient(circle,rgba(255,90,70,.13),transparent 58%)}
#battleFullFx.go{animation:monsterRush .68s cubic-bezier(.18,.8,.25,1)}
#battleFullFx canvas{width:min(44vmin,330px);image-rendering:pixelated;
  filter:drop-shadow(0 18px 0 rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(255,90,70,.72))}
#battleFullFx.boss canvas{width:min(58vmin,440px)}
#battleFullFx .fxName{position:absolute;top:12%;left:0;right:0;text-align:center;color:#ffe38a;
  font-size:clamp(18px,4vw,38px);font-weight:900;letter-spacing:5px;text-shadow:0 4px 0 #49120b,0 0 24px #ff6a4a}
@keyframes monsterRush{0%{opacity:0;transform:translateY(-16vh) scale(.35)}18%{opacity:.95}
  52%{opacity:1;transform:translateY(7vh) scale(1.28)}76%{filter:brightness(2.2);transform:translateY(11vh) scale(1.4)}
  100%{opacity:0;transform:translateY(18vh) scale(1.62)}}
#battleFullFx.go.motion-hover canvas{animation:monsterCineHover .68s ease-out}
#battleFullFx.go.motion-skitter canvas{animation:monsterCineSkitter .68s steps(5)}
#battleFullFx.go.motion-coil canvas{animation:monsterCineCoil .68s ease-out}
#battleFullFx.go.motion-stomp canvas{animation:monsterCineStomp .68s cubic-bezier(.2,.8,.2,1)}
#battleFullFx.go.motion-bounce canvas{animation:monsterCineBounce .68s ease-out}
#battleFullFx.go.motion-pounce canvas{animation:monsterCinePounce .68s cubic-bezier(.16,.9,.25,1)}
@keyframes monsterCineHover{0%{transform:translate(-32vw,-12vh) rotate(-12deg)}58%{transform:translate(7vw,5vh) rotate(4deg)}100%{transform:translate(18vw,18vh) rotate(9deg)}}
@keyframes monsterCineSkitter{0%{transform:translate(-28vw,-5vh) rotate(-5deg)}45%{transform:translate(5vw,8vh) rotate(7deg)}100%{transform:translate(26vw,14vh) rotate(-4deg)}}
@keyframes monsterCineCoil{0%{transform:scale(.65) rotate(-24deg)}55%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(1.35) rotate(22deg)}}
@keyframes monsterCineStomp{0%{transform:translateY(-28vh) scale(.82)}64%{transform:translateY(10vh) scale(1.22, .9)}100%{transform:translateY(14vh) scale(1.35,1.05)}}
@keyframes monsterCineBounce{0%{transform:translateY(-18vh) scale(.7)}45%{transform:translateY(2vh) scale(1.18,.84)}100%{transform:translateY(17vh) scale(.95,1.28)}}
@keyframes monsterCinePounce{0%{transform:translate(-20vw,-12vh) scale(.68)}58%{transform:translate(4vw,5vh) scale(1.22)}100%{transform:translate(18vw,17vh) scale(1.42)}}

/* 怪物物種技能：每次只建立一個容器與最多 7 顆粒子，避免怪群施法造成卡頓。 */
.monsterSkillFx{position:absolute;inset:0;z-index:52;pointer-events:none;overflow:hidden;
  --mc:#8fd0ff;--sx:50%;--sy:42%;--tx:50%;--ty:78%;animation:msFade .92s ease-out forwards}
.monsterSkillFx::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--sx) var(--sy),color-mix(in srgb,var(--mc) 28%,transparent),transparent 42%);
  opacity:.62;animation:msFlash .64s ease-out forwards}
.ms-title{position:absolute;top:8%;left:8%;right:8%;text-align:center;color:#fff;font-size:clamp(13px,2.5vw,22px);
  font-weight:900;letter-spacing:2px;text-shadow:0 2px 0 #000,0 0 14px var(--mc);animation:msTitle .8s ease-out forwards}
.ms-sigil{position:absolute;left:var(--sx);top:var(--sy);width:70px;height:70px;margin:-35px;
  display:grid;place-items:center;border:4px solid var(--mc);border-radius:50%;color:#fff;font-size:38px;
  background:color-mix(in srgb,var(--mc) 18%,transparent);box-shadow:0 0 18px var(--mc),inset 0 0 16px var(--mc)}
.ms-ground{position:absolute;left:var(--sx);top:var(--sy);width:46px;height:20px;margin:-10px -23px;
  display:none;border:4px solid var(--mc);border-radius:50%;box-shadow:0 0 15px var(--mc)}
.ms-beam{position:absolute;left:var(--sx);top:var(--sy);width:8px;height:8px;border-radius:6px;background:#fff;
  display:none;box-shadow:0 0 9px 3px var(--mc);transform-origin:center;animation:msBeam .56s ease-in forwards}
.ms-particle{position:absolute;left:var(--sx);top:var(--sy);font-style:normal;color:var(--mc);font-size:18px;
  text-shadow:0 0 9px var(--mc);animation:msParticle .75s calc(var(--i)*.035s) ease-out forwards}
.ms-caster{position:absolute;left:var(--sx);top:var(--sy);width:76px;height:76px;margin:-38px;
  object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 0 rgba(0,0,0,.36)) drop-shadow(0 0 12px var(--mc));
  animation:msCasterStrike .72s cubic-bezier(.18,.84,.24,1) forwards}
.monsterSkillFx.motion-hover .ms-caster{animation-name:msCasterHover}
.monsterSkillFx.motion-skitter .ms-caster{animation-name:msCasterSkitter;animation-timing-function:steps(5)}
.monsterSkillFx.motion-coil .ms-caster{animation-name:msCasterCoil}
.monsterSkillFx.motion-stomp .ms-caster{animation-name:msCasterStomp}
.monsterSkillFx.motion-bounce .ms-caster{animation-name:msCasterBounce}
.monsterSkillFx.mtier-6 .ms-caster,.monsterSkillFx.mtier-7 .ms-caster{width:96px;height:96px;margin:-48px;filter:drop-shadow(0 9px 0 rgba(0,0,0,.4)) drop-shadow(0 0 22px var(--mc))}
@keyframes msCasterStrike{0%{opacity:.15;transform:translate(-18px,-12px) scale(.72)}38%{opacity:1;transform:translate(8px,7px) scale(1.12)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy))) scale(1.35)}}
@keyframes msCasterHover{0%{opacity:0;transform:translate(-45px,-25px) rotate(-10deg)}42%{opacity:1;transform:translate(5px,-8px) rotate(2deg)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy))) rotate(12deg)}}
@keyframes msCasterSkitter{0%{opacity:0;transform:translateX(-36px)}45%{opacity:1;transform:translate(12px,8px)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy)))}}
@keyframes msCasterCoil{0%{opacity:0;transform:scale(.45) rotate(-35deg)}48%{opacity:1;transform:scale(1.15) rotate(7deg)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy))) rotate(28deg) scale(1.3)}}
@keyframes msCasterStomp{0%{opacity:0;transform:translateY(-42px) scale(.8)}55%{opacity:1;transform:translateY(9px) scale(1.18,.88)}100%{opacity:0;transform:translateY(18px) scale(1.35,1)}}
@keyframes msCasterBounce{0%{opacity:0;transform:translateY(22px) scale(.7)}48%{opacity:1;transform:translateY(-16px) scale(1.12)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy))) scale(.9,1.35)}}
.ms-ward .ms-sigil{animation:msWard .78s ease-out forwards}.ms-ward .ms-ground{display:block;animation:msRing .72s ease-out forwards}
.ms-hex .ms-sigil,.ms-venom .ms-sigil{left:var(--tx);top:var(--ty);animation:msHex .82s ease-out forwards}
.ms-fury .ms-sigil{animation:msFury .78s ease-out forwards}.ms-fury .ms-particle{animation-name:msFlame}
.ms-swift .ms-sigil{border-style:dashed;animation:msSwift .62s ease-out forwards}.ms-swift .ms-beam{display:block;animation-name:msDash}
.ms-leech .ms-sigil{left:var(--tx);top:var(--ty);animation:msLeech .8s ease-out forwards}.ms-leech .ms-beam{display:block}.ms-leech .ms-particle{left:var(--tx);top:var(--ty);animation-name:msSuck}
.ms-breaker .ms-sigil{left:var(--tx);top:var(--ty);animation:msBreak .72s cubic-bezier(.2,.8,.2,1) forwards}.ms-breaker .ms-beam{display:block}.ms-breaker .ms-particle{left:var(--tx);top:var(--ty);animation-name:msShard}
.ms-regen .ms-sigil{animation:msRegen .86s ease-out forwards}.ms-regen .ms-particle{animation-name:msLeaf}
.ms-chorus .ms-sigil{animation:msChorus .8s ease-out forwards}.ms-chorus .ms-ground{display:block;animation:msRing .7s ease-out forwards}
.ms-chaos .ms-sigil{animation:msChaos .84s linear forwards}.ms-chaos .ms-particle{animation-name:msChaosBit}
@keyframes msFade{0%,82%{opacity:1}100%{opacity:0}}@keyframes msFlash{0%{opacity:0}22%{opacity:.65}100%{opacity:0}}
@keyframes msTitle{0%{opacity:0;transform:translateY(-14px) scale(.7)}25%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
@keyframes msWard{0%{opacity:0;transform:scale(.15) rotate(-25deg)}38%{opacity:1;transform:scale(1.18)}100%{opacity:0;transform:scale(1.45)}}
@keyframes msRing{0%{opacity:1;transform:scale(.25)}100%{opacity:0;transform:scale(8)}}
@keyframes msHex{0%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1}100%{opacity:0;transform:scale(2.1) rotate(300deg);filter:hue-rotate(90deg)}}
@keyframes msFury{0%{opacity:0;transform:translateY(20px) scale(.3)}45%{opacity:1;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-35px) scale(1.4)}}
@keyframes msSwift{0%{opacity:0;transform:translate(-70px,-20px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(85px,55px) scale(1.2)}}
@keyframes msDash{0%{opacity:0;transform:scale(.1)}35%{opacity:1;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy))) scale(2)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx)),calc(var(--ty) - var(--sy))) scale(5)}}
@keyframes msLeech{0%{opacity:0;transform:scale(1.8)}42%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:translate(calc(var(--sx) - var(--tx)),calc(var(--sy) - var(--ty))) scale(.25)}}
@keyframes msBreak{0%{opacity:0;transform:scale(.3)}36%{opacity:1;transform:scale(1.7)}55%{transform:scale(.7) rotate(18deg)}100%{opacity:0;transform:scale(2.6) rotate(-25deg)}}
@keyframes msRegen{0%{opacity:0;transform:translateY(18px) scale(.3)}45%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.45)}}
@keyframes msChorus{0%{opacity:0;transform:scale(.2)}34%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes msChaos{0%{opacity:0;transform:scale(.2) rotate(0);filter:hue-rotate(0)}35%{opacity:1}100%{opacity:0;transform:scale(2.2) rotate(540deg);filter:hue-rotate(300deg)}}
@keyframes msParticle{0%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.1)}}
@keyframes msFlame{0%{opacity:0;transform:translate(0,15px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) - 45px)) scale(1.5)}}

@keyframes msShard{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(220deg)}}
@keyframes msLeaf{0%{opacity:0;transform:translate(0,18px) rotate(0)}35%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) - 42px)) rotate(180deg)}}

@media (prefers-reduced-motion:reduce){.monsterSkillFx{animation-duration:.25s}.monsterSkillFx *{animation-duration:.25s!important}.foe .monsterSprite{animation:none!important}}

/* 陷阱驚嚇 */
.trapshake{animation:trapShake .65s cubic-bezier(.36,.07,.19,.97)}
@keyframes trapShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  8%{transform:translate(-14px,6px) rotate(-2deg)}
  20%{transform:translate(13px,-8px) rotate(2deg)}
  32%{transform:translate(-11px,5px) rotate(-1.5deg)}
  46%{transform:translate(10px,-6px) rotate(1.5deg)}
  60%{transform:translate(-7px,4px) rotate(-1deg)}
  76%{transform:translate(5px,-3px) rotate(.6deg)}
  90%{transform:translate(-2px,1px)}}
.trapBang{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
  font-size:82px;z-index:75;pointer-events:none;
  filter:drop-shadow(0 0 20px #ff3b3b);
  animation:bangPop .85s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes bangPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-18deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.5) rotate(9deg)}
  40%{transform:translate(-50%,-50%) scale(1.15) rotate(-5deg)}

/* 環繞 Boss 的蓄力眼睛 */
/* 環繞圈整體上移：眼睛繞在頭頂上方，不遮到下方的血量與弱點資訊 */
.eyering{position:absolute;left:50%;top:22%;width:0;height:0;z-index:26;pointer-events:none}
.beye{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;background:#241a2e;border:2px solid #4a3a5a;
  display:flex;align-items:center;justify-content:center;
  transition:background .25s,border-color .25s,box-shadow .25s}
.beye i{width:8px;height:2px;border-radius:1px;background:#5a4a6a;transition:.25s}
.beye.on{background:radial-gradient(circle at 50% 45%,#fff 8%,#ffd0d0 18%,#ff3b3b 55%,#6a0000 100%);
  border-color:#ff8a8a;box-shadow:0 0 12px #ff3b3b,0 0 22px rgba(255,59,59,.5)}
.beye.on i{width:4px;height:8px;border-radius:50%;background:#2a0000}
.beye.just{animation:eyePop .4s ease-out}
@keyframes eyePop{0%{transform:scale(.2)}55%{transform:scale(1.7)}100%{transform:scale(1)}}
.eyering.full .beye{animation:eyeGlow .5s ease-in-out infinite alternate}
@keyframes eyeGlow{100%{box-shadow:0 0 20px #ff3b3b,0 0 34px rgba(255,59,59,.9);
  transform:scale(1.18)}}
.eyec{font-size:9px;color:#ff9a9a;font-weight:900;text-align:center;
  text-shadow:0 1px 2px #000}
.foe.blast{animation:bossBlast .6s}
@keyframes bossBlast{0%,100%{transform:none;filter:none}
  25%{transform:scale(1.25);filter:brightness(2.5) drop-shadow(0 0 20px #ff3b3b)}
  60%{transform:scale(1.1);filter:brightness(1.6)}}
.fx-eyebeam{position:absolute;width:6px;height:34px;border-radius:3px;z-index:36;
  background:linear-gradient(180deg,#ff3b3b,#ffb37a);box-shadow:0 0 14px #ff3b3b;
  animation:eyebeam .5s ease-in forwards;pointer-events:none}
@keyframes eyebeam{0%{transform:translate(0,0) scaleY(.3);opacity:0}
  20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scaleY(1.6);opacity:0}}

/* 連發火球 */
.fx-fire{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:36;
  pointer-events:none}
.fx-fire .core{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff 8%,#ffe38a 25%,#ff8a3a 55%,#c53f1f 100%);
  box-shadow:0 0 18px #ff8a3a,0 0 32px rgba(255,90,30,.7)}
.fx-fire .tail{position:absolute;left:-16px;top:8px;width:22px;height:10px;border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(255,150,60,.85));filter:blur(2px)}
.fx-fire.boom .core{animation:fireBoom .22s ease-out forwards}
@keyframes fireBoom{100%{transform:scale(3);opacity:0;
  box-shadow:0 0 40px #ffb37a,0 0 70px rgba(255,90,30,.9)}}

/* 噴泉傷害數字 */
.dmgNum.fountain{animation:fountain 1s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fountain{
  0%{transform:translate(0,0) scale(.5);opacity:0}
  15%{transform:translate(calc(var(--vx)*.4),calc(var(--vy)*.5)) scale(1.5);opacity:1}
  45%{transform:translate(calc(var(--vx)*.85),var(--vy)) scale(1.1);opacity:1}
  100%{transform:translate(var(--vx),var(--fall)) scale(.8);opacity:0}}
/* 子彈時間 */
#battle.bullet #field{transform:scale(1.07);filter:saturate(1.5) contrast(1.15);
  transition:transform .5s cubic-bezier(.2,.9,.3,1),filter .5s}
#battle.bullet .foe:not(.ko){filter:grayscale(.75) brightness(.6);transition:filter .3s}
#battle.bullet #hand{filter:brightness(.7);transition:filter .3s}
.foe.ko{animation:koShake .55s;z-index:60!important}
@keyframes koShake{0%{transform:scale(1)}18%{transform:scale(1.35) rotate(-6deg);filter:brightness(3)}
  40%{transform:scale(1.2) rotate(5deg)}70%{transform:scale(1.1) rotate(-3deg);opacity:.8}
  100%{transform:scale(.85);opacity:0}}
.ko-burst{position:absolute;width:0;height:0;z-index:55;pointer-events:none}
.ko-burst i{position:absolute;left:0;top:0;width:26px;height:4px;margin:-2px 0 0 0;
  background:linear-gradient(90deg,#fff,transparent);transform-origin:0 50%;
  animation:koRay .5s ease-out forwards}
@keyframes koRay{0%{opacity:1;width:8px}100%{opacity:0;width:70px}}
/* 全螢幕連擊演出 */
.fx-streak{left:0;right:0;height:5px;z-index:34;animation:streak .35s ease-out forwards}
@keyframes streak{0%{opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1)}
  100%{opacity:0;transform:scaleX(1.3)}}
.fx-radial{left:50%;top:45%;width:0;height:0;z-index:33}
.fx-ray{position:absolute;left:0;top:0;width:40px;height:3px;transform-origin:0 50%;
  animation:rayOut .45s ease-out forwards}
@keyframes rayOut{0%{opacity:1;width:10px}100%{opacity:0;width:180px}}
.fx-fullflash{left:0;right:0;top:0;bottom:0;opacity:.28;z-index:32;
  animation:fxflash .3s ease-out forwards}
#animCnt.hot{color:#fff;text-shadow:0 2px 0 #a01f1f,0 0 16px #ff6a6a;
  animation:cntPulse .4s ease-in-out infinite alternate}
@keyframes cntPulse{100%{transform:scale(1.2)}}

/* 出牌卡片飛出 */
.cardGhost{position:absolute;z-index:44;pointer-events:none;border-radius:6px;
  transition:transform .38s cubic-bezier(.35,0,.6,1),opacity .38s;
  transform-origin:50% 50%;box-shadow:0 0 26px rgba(236,194,78,.85)}
.cardGhost.go{transform:translate(0,-120px) scale(.35) rotate(-16deg);opacity:0}
/* 命中停格 */
#battle.hitstop #field{transform:scale(1.035);filter:brightness(1.35) contrast(1.15)}
#battle.hitstop .foe{animation-play-state:paused}
#battle #field{transition:transform .08s,filter .08s}
/* 投射物拖尾 */
.fx-trail{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;
  z-index:33;pointer-events:none;opacity:.85;filter:blur(1px);
  animation:trailFade .38s ease-out forwards}
@keyframes trailFade{0%{transform:scale(1);opacity:.85}100%{transform:scale(.2);opacity:0}}
/* 命中衝擊光環 */
.fx-impact{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:5px solid;z-index:37;pointer-events:none;
  animation:impactOut .34s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes impactOut{0%{transform:scale(.3);opacity:1;border-width:7px}
  100%{transform:scale(4.6);opacity:0;border-width:1px}}
/* 高連擊：電弧 */
.fx-bolt{position:absolute;width:150px;height:5px;border-radius:3px;z-index:35;
  pointer-events:none;filter:blur(.5px);animation:boltIn .3s ease-out forwards}
@keyframes boltIn{0%{opacity:0;transform:scaleX(.1)}
  35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.2)}}
/* 能量漩渦 */
.fx-vortex{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  border:4px dashed;z-index:34;pointer-events:none;
  animation:vortexIn .7s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes vortexIn{0%{transform:scale(2.4) rotate(0);opacity:0}
  40%{opacity:1}100%{transform:scale(.2) rotate(540deg);opacity:0}}
/* 20 連：巨環 */
.fx-megaring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  border:6px solid;z-index:38;pointer-events:none;
  animation:megaOut .6s cubic-bezier(.15,.85,.3,1) forwards}
@keyframes megaOut{0%{transform:scale(.2);opacity:1;border-width:8px}
  100%{transform:scale(11);opacity:0;border-width:1px}}

/* ═══ 合成卡的強化外框 ═══ */
.card.fused{position:relative;overflow:visible}
/* 第一層合成：雙線金屬框 */
.card.fuse1{box-shadow:0 5px 0 #05040c,0 0 0 2px #6a8fd0,0 0 12px rgba(106,143,208,.5)}
/* 第二層：漸層流光框 */
.card.fuse2{box-shadow:0 5px 0 #05040c,0 0 0 2px #c98adf,0 0 16px rgba(201,138,223,.6)}
.card.fuse2::before{content:'';position:absolute;inset:-4px;border-radius:8px;z-index:-1;
  background:linear-gradient(120deg,#c98adf,#8fd0ff,#c98adf);
  background-size:200% 200%;animation:fuseFlow 3s linear infinite;opacity:.55}
/* 第三層（頂點）：金色旋轉光環 */
.card.fuse3{box-shadow:0 5px 0 #05040c,0 0 0 3px #ecc24e,0 0 22px rgba(236,194,78,.8)}
.card.fuse3::before{content:'';position:absolute;inset:-5px;border-radius:9px;z-index:-1;
  background:conic-gradient(#ecc24e,#fff6c8,#ff9a5a,#ecc24e);
  animation:fuseSpin 2.4s linear infinite;opacity:.75}
.card.fuse3::after{content:'★';position:absolute;top:-8px;right:-6px;font-size:15px;
  color:#ffe38a;text-shadow:0 0 8px #ecc24e,0 2px 0 #000;z-index:3;
  animation:fuseStar 1.6s ease-in-out infinite alternate}
@keyframes fuseFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes fuseSpin{100%{transform:rotate(360deg)}}
@keyframes fuseStar{0%{transform:scale(1)}100%{transform:scale(1.25)}}
/* 進化卡：銀色細邊 */
.card.evolved{box-shadow:0 5px 0 #05040c,0 0 0 2px #cfe0ff,0 0 10px rgba(207,224,255,.45)}
/* 合成卡的圖示加底光 */
.card.fused .cicon{filter:drop-shadow(0 0 8px currentColor)}
.card.fuse3 .cicon{animation:iconGlow 1.8s ease-in-out infinite alternate}
@keyframes iconGlow{0%{transform:scale(1)}100%{transform:scale(1.12)}}

#cineFx{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden}
.cine{position:absolute;inset:0;pointer-events:none}
/* 數學教師專屬：透明人物、公式法陣、三冊課本與全力一擊。 */
.mathTeacherFoe{filter:drop-shadow(0 0 12px rgba(255,226,93,.72))}.mathTeacherFoe canvas{filter:drop-shadow(0 8px 0 rgba(0,0,0,.55)) drop-shadow(0 0 10px #b677ff)}
.teacherTextbookCine{background:radial-gradient(circle at 50% 45%,rgba(137,89,209,.44),rgba(8,3,20,.78) 68%,transparent 72%);animation:teacherCineFade 1.05s ease both}.teacherTextbookCine img{position:absolute;left:50%;top:8%;height:58%;transform:translateX(-50%);image-rendering:pixelated;filter:drop-shadow(0 0 20px #d69cff);animation:teacherCineCast 1.05s steps(8) both}.teacherCineVignette{position:absolute;inset:0;box-shadow:inset 0 0 90px 35px rgba(22,5,48,.92)}.teacherCineFormula{position:absolute;left:50%;top:34%;width:290px;height:80px;margin-left:-145px;text-align:center;color:#fff4a8;font:900 25px/80px Georgia;border:4px dashed #ffe25d;border-radius:50%;letter-spacing:12px;text-shadow:0 0 12px #74ddff;animation:teacherCineFormula 1s linear both}.teacherCineBooks{position:absolute;inset:0}.teacherCineBooks i{position:absolute;left:54%;top:43%;font-style:normal;font-size:55px;filter:drop-shadow(0 0 12px #fff);animation:teacherCineBook .78s .24s steps(7) both}.teacherCineBooks i:nth-child(2){animation-delay:.38s}.teacherCineBooks i:nth-child(3){animation-delay:.52s}.teacherCinePages{position:absolute;left:50%;top:48%;color:#fffde5;font-size:30px;white-space:nowrap;animation:teacherCinePages .8s .3s ease-out both}.teacherCineTitle{position:absolute;left:4%;right:4%;bottom:12%;padding:9px;text-align:center;color:#fff4a8;font-size:clamp(21px,5vw,38px);font-weight:900;letter-spacing:5px;text-shadow:0 0 22px #b65eff,0 4px 0 #29143e;animation:teacherCineTitle 1.05s ease both}
.teacherFullPowerCine{background:radial-gradient(circle,#fff 0 4%,#ffe25d 5% 15%,#68dfff 16% 28%,rgba(105,46,170,.92) 29% 55%,#090313 75%);animation:teacherPowerBg 1.9s ease both}.teacherPowerRays{position:absolute;left:50%;top:50%;width:28px;height:28px;border:8px solid #fff;border-radius:50%;box-shadow:0 0 28px #fff,0 0 70px #ffe25d;animation:teacherPowerRays 1.55s ease-out both}.teacherPowerSequence{position:absolute;left:0;right:0;top:27%;text-align:center;color:#fff;font:900 clamp(20px,6vw,46px)/1 monospace;letter-spacing:6px;text-shadow:0 0 22px #58dfff;animation:teacherPowerSeq 1.5s steps(6) both}.teacherPowerTitle{position:absolute;left:2%;right:2%;top:53%;text-align:center;color:#fff7aa;font-size:clamp(28px,7vw,58px);font-weight:900;text-shadow:0 0 30px #fff,0 5px 0 #762f9d;animation:teacherPowerTitle 1.8s ease both}.teacherPowerTitle em{display:block;margin-top:14px;color:#ff5b69;font:900 clamp(18px,5vw,34px)/1 monospace;letter-spacing:5px}
@keyframes teacherCineFade{0%{opacity:0}12%,82%{opacity:1}100%{opacity:0}}@keyframes teacherCineCast{0%{transform:translateX(-50%) scale(.65);filter:brightness(.25)}35%,75%{transform:translateX(-50%) scale(1);filter:brightness(1.45) drop-shadow(0 0 25px #fff)}100%{transform:translateX(-50%) scale(1.08);opacity:0}}@keyframes teacherCineFormula{0%{opacity:0;transform:scale(.2) rotate(0)}30%,80%{opacity:1}100%{opacity:0;transform:scale(1.9) rotate(300deg)}}@keyframes teacherCineBook{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-58vw,34vh) rotate(-70deg) scale(1.8)}}@keyframes teacherCinePages{0%{opacity:0;transform:translate(-50%,0) scale(.2)}45%{opacity:1}100%{opacity:0;transform:translate(-50%,28vh) scale(2.2) rotate(18deg)}}@keyframes teacherCineTitle{0%{opacity:0;transform:scale(1.5)}28%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-15px)}}@keyframes teacherPowerBg{0%{opacity:0}15%,78%{opacity:1}100%{opacity:0}}@keyframes teacherPowerRays{0%{transform:translate(-50%,-50%) scale(.1)}100%{transform:translate(-50%,-50%) scale(36);opacity:0;border-width:1px}}@keyframes teacherPowerSeq{0%{opacity:0;clip-path:inset(0 100% 0 0)}25%,75%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;transform:scale(1.25)}}@keyframes teacherPowerTitle{0%{opacity:0;transform:scale(1.8);filter:blur(8px)}25%,72%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(.9)}}
/* 出牌大招 */
.cineBands{position:absolute;inset:0}
.cineBands i{position:absolute;left:-10%;width:120%;height:6px;opacity:0;
  animation:cbBand .55s cubic-bezier(.2,.9,.3,1) forwards}
.cineBands i:nth-child(1){top:38%;animation-delay:0ms}
.cineBands i:nth-child(2){top:50%;height:10px;animation-delay:60ms}
.cineBands i:nth-child(3){top:62%;animation-delay:120ms}
@keyframes cbBand{0%{opacity:0;transform:scaleX(.1)}
  35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.15)}}
.cineBurst{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
  border:6px solid;border-radius:50%;opacity:0;
  animation:cbBurst .6s cubic-bezier(.15,.85,.3,1) forwards}
@keyframes cbBurst{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(14);border-width:1px}}
.cineName{position:absolute;left:0;right:0;top:44%;text-align:center;
  font-size:30px;font-weight:900;letter-spacing:3px;opacity:0;
  animation:cbName .8s cubic-bezier(.2,1,.3,1) forwards}
.cineName em{display:block;font-style:normal;font-size:15px;letter-spacing:6px;
  margin-top:6px;color:#fff;text-shadow:0 2px 0 #000}
@keyframes cbName{0%{opacity:0;transform:scale(1.6) translateY(10px);filter:blur(6px)}
  30%{opacity:1;transform:scale(1);filter:blur(0)}
  70%{opacity:1;transform:scale(1.04)}
  100%{opacity:0;transform:scale(.94) translateY(-14px)}}
.cineRays{position:absolute;left:50%;top:50%;width:0;height:0}
.cineRays b{position:absolute;left:0;top:0;width:50vw;height:3px;transform-origin:0 50%;
  opacity:0;animation:cbRay .55s ease-out forwards}
@keyframes cbRay{0%{opacity:1;width:20px}100%{opacity:0;width:60vw}}
.cineFlash{position:absolute;inset:0;opacity:.35;animation:cbFlash .35s ease-out forwards}
@keyframes cbFlash{0%{opacity:.45}100%{opacity:0}}
/* Boss 大招 */
.cbVignette{position:absolute;inset:0;
  background:radial-gradient(circle at 50% 42%,transparent 20%,rgba(70,0,0,.55) 70%,rgba(20,0,0,.9) 100%);
  opacity:0;animation:cbVig 1.3s ease-out forwards}
@keyframes cbVig{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
.cbEyes{position:absolute;left:0;right:0;top:24%;display:flex;justify-content:center;gap:10px}
.cbEyes i{width:20px;height:20px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 50% 45%,#fff 10%,#ffd0d0 22%,#ff3b3b 60%,#5a0000 100%);
  box-shadow:0 0 18px #ff3b3b;animation:cbEye 1.2s ease-out forwards}
@keyframes cbEye{0%{opacity:0;transform:scale(.2)}
  20%{opacity:1;transform:scale(1.5)}45%{transform:scale(1)}
  70%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
.cbBeams{position:absolute;left:50%;top:34%;width:0;height:0}
.cbBeams b{position:absolute;left:0;top:0;width:60vw;height:7px;transform-origin:0 50%;
  background:linear-gradient(90deg,#fff,#ff3b3b 30%,transparent);opacity:0;
  animation:cbBeam .8s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:.35s}
@keyframes cbBeam{0%{opacity:0;width:0}30%{opacity:1}100%{opacity:0;width:80vw}}
.cbTitle{position:absolute;left:0;right:0;top:52%;text-align:center;opacity:0;
  animation:cbTitle 1.2s cubic-bezier(.2,1,.3,1) forwards;animation-delay:.3s}
.cbName{display:block;font-size:16px;font-weight:900;color:#ff9a9a;letter-spacing:4px;
  text-shadow:0 2px 0 #000}
.cbSkill{display:block;font-size:34px;font-weight:900;color:#fff;letter-spacing:6px;
  text-shadow:0 0 28px #ff3b3b,0 4px 0 #5a0000;margin-top:4px}
.cbDmg{display:block;font-family:"Press Start 2P";font-size:26px;color:#ffe38a;
  margin-top:10px;text-shadow:0 3px 0 #000,0 0 20px #ff6a3a}
@keyframes cbTitle{0%{opacity:0;transform:scale(1.5);filter:blur(8px)}
  25%{opacity:1;transform:scale(1);filter:blur(0)}
  75%{opacity:1}100%{opacity:0;transform:scale(.95)}}
.cbShock{position:absolute;left:50%;top:42%;width:60px;height:60px;margin:-30px 0 0 -30px;
  border:8px solid #ff3b3b;border-radius:50%;opacity:0;
  animation:cbShock .9s cubic-bezier(.15,.85,.3,1) forwards;animation-delay:.35s}
@keyframes cbShock{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(18);border-width:1px}}
.cbFlash{position:absolute;inset:0;background:#ff3b3b;opacity:0;
  animation:cbBossFlash .5s ease-out forwards;animation-delay:.35s}
@keyframes cbBossFlash{0%{opacity:.5}100%{opacity:0}}

/* 分級震動 */
@keyframes shk2{0%,100%{transform:none}20%{transform:translate(-4px,3px)}
  40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
@keyframes shk3{0%,100%{transform:none}15%{transform:translate(-7px,5px) rotate(-.4deg)}
  35%{transform:translate(7px,-5px) rotate(.4deg)}55%{transform:translate(-5px,-4px)}
  75%{transform:translate(5px,4px) rotate(-.2deg)}}
@keyframes shk4{0%,100%{transform:none}10%{transform:translate(-11px,8px) rotate(-.8deg)}
  25%{transform:translate(11px,-8px) rotate(.8deg)}40%{transform:translate(-9px,-6px) rotate(-.5deg)}
  55%{transform:translate(9px,6px) rotate(.5deg)}70%{transform:translate(-6px,4px)}
  85%{transform:translate(6px,-3px)}}
#field.shk2{animation:shk2 .3s}
#field.shk3{animation:shk3 .4s}
#field.shk4{animation:shk4 .5s}
/* 手牌被震落 */
@keyframes quake{0%,100%{transform:none}
  15%{transform:translate(-8px,6px) rotate(-1.2deg)}
  30%{transform:translate(8px,-5px) rotate(1.2deg)}
  45%{transform:translate(-6px,4px) rotate(-.8deg)}
  60%{transform:translate(6px,-3px) rotate(.8deg)}
  80%{transform:translate(-3px,2px)}}
#hand.quake{animation:quake .55s}
/* 地面裂痕 */
.fx-crack{position:absolute;width:60px;height:4px;z-index:34;pointer-events:none;
  background:linear-gradient(90deg,transparent,#3a1a1a 20%,#000 50%,#3a1a1a 80%,transparent);
  box-shadow:0 0 8px rgba(0,0,0,.9);animation:crackOut .6s ease-out forwards}
@keyframes crackOut{0%{opacity:0;transform:scaleX(.1)}
  25%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.3)}}

/* 卡牌專屬特效 */
.fx-blade,.fx-lash,.fx-beam,.fx-ring,.fx-drop,.fx-orbit,.fx-crossV,.fx-crossH,
.fx-shield,.fx-ripple,.fx-mote,.fx-formula,.fx-spark,.fx-slash,.fx-shock,.fx-flash{
  position:absolute;pointer-events:none;z-index:35}
.fx-blade{width:30px;height:7px;background:currentColor;border-radius:2px;
  box-shadow:0 0 10px currentColor}
.fx-lash{width:170px;height:92px;margin:-46px 0 0 -85px;border:6px solid #ff9a5a;
  border-radius:50%;border-color:#ff9a5a transparent transparent transparent;
  animation:lash .34s ease-out forwards}
@keyframes lash{0%{transform:rotate(-70deg) scale(.4);opacity:0}
  40%{opacity:1}100%{transform:rotate(50deg) scale(1.5);opacity:0}}
.fx-beam{width:26px;margin-left:-13px;top:0;animation:beam .36s ease-out forwards;
  filter:blur(1px)}
@keyframes beam{0%{transform:scaleX(.2);opacity:0}25%{transform:scaleX(1.4);opacity:1}
  100%{transform:scaleX(.3);opacity:0}}
.fx-ring{width:30px;height:30px;margin:-15px 0 0 -15px;border:5px solid;border-radius:50%;
  animation:ringOut .5s ease-out forwards}
@keyframes ringOut{0%{transform:scale(.3);opacity:1}100%{transform:scale(9);opacity:0}}
.fx-drop{width:11px;height:11px;border-radius:50%;background:#8fd0ff;margin:-3px 0 0 -3px;
  box-shadow:0 0 8px #8fd0ff;animation:drop .45s ease-out forwards}
@keyframes drop{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.fx-orbit{width:70px;height:70px;margin:-35px 0 0 -35px;border:5px dashed;border-radius:50%;
  animation:orbit .5s linear forwards}
@keyframes orbit{0%{transform:rotate(0) scale(.5);opacity:0}30%{opacity:1}
  100%{transform:rotate(320deg) scale(1.4);opacity:0}}
.fx-crossV{width:20px;top:0;bottom:0;margin-left:-5px;animation:crossFade .4s ease-out forwards}
.fx-crossH{height:20px;left:0;right:0;margin-top:-5px;animation:crossFade .4s ease-out forwards}
@keyframes crossFade{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.2)}}
.fx-shield{font-size:64px;animation:shieldUp .55s ease-out forwards;
  filter:drop-shadow(0 0 14px #8fd0ff)}
@keyframes shieldUp{0%{transform:translateY(18px) scale(.4);opacity:0}
  40%{transform:translateY(-6px) scale(1.15);opacity:1}
  100%{transform:translateY(-16px) scale(1);opacity:0}}
.fx-ripple{width:36px;height:36px;margin:-18px 0 0 -18px;border:5px solid;border-radius:50%;
  animation:ringOut .6s ease-out forwards}
.fx-mote{width:13px;height:13px;border-radius:50%;background:#ff8a8a;margin:-4px 0 0 -4px;
  box-shadow:0 0 10px #ff5a5a;animation:mote .5s ease-in forwards}
@keyframes mote{0%{transform:translate(0,0);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(.3);opacity:0}}
.fx-formula{font-family:ui-monospace,monospace;font-size:30px;font-weight:900;
  white-space:nowrap;transform:translateX(-50%);
  text-shadow:0 2px 0 #000,0 0 16px currentColor;animation:formula .7s ease-out forwards}
@keyframes formula{0%{opacity:0;transform:translateX(-50%) scale(.4)}
  25%{opacity:1;transform:translateX(-50%) scale(1.25)}
  70%{opacity:1;transform:translateX(-50%) translateY(-14px) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.9)}}
.fx-spark{width:10px;height:10px;border-radius:50%;margin:-3px 0 0 -3px;
  animation:spark .5s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1.4);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.fx-slash{width:130px;height:14px;margin:-7px 0 0 -65px;border-radius:4px;
  animation:slashFx .3s ease-out forwards}
@keyframes slashFx{0%{transform:rotate(-30deg) scaleX(.2);opacity:0}
  40%{opacity:1}100%{transform:rotate(-30deg) scaleX(1.6);opacity:0}}
.fx-shock{width:46px;height:46px;margin:-23px 0 0 -23px;border:6px solid;border-radius:50%;
  animation:shockOut .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes shockOut{0%{transform:scale(.2);opacity:1;border-width:6px}
  100%{transform:scale(7);opacity:0;border-width:1px}}
.fx-flash{left:0;right:0;top:0;bottom:0;opacity:.32;animation:fxflash .28s ease-out forwards}
@keyframes fxflash{0%{opacity:.4}100%{opacity:0}}

.fx-buff{font-size:30px;font-weight:900;text-shadow:0 0 12px currentColor;
  animation:buffUp .6s ease-out forwards}
@keyframes buffUp{0%{transform:translateY(14px) scale(.5);opacity:0}
  35%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
.fx-hex{font-size:56px;color:#e26bd6;transform:translate(-50%,-50%);
  text-shadow:0 0 18px #e26bd6;animation:hexSpin .6s ease-out forwards}
@keyframes hexSpin{0%{transform:translate(-50%,-50%) rotate(0) scale(.3);opacity:0}
  40%{opacity:1}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1.6);opacity:0}}

/* 出牌動畫 */
.flycard{position:absolute;width:40px;height:40px;border-radius:6px;z-index:40;
  background:linear-gradient(180deg,#f0cf78,#c98a3c);border:2px solid #6b4f12;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(236,194,78,.9);pointer-events:none}
.flycard .fi{font-size:20px}
.flycard.burst{animation:fburst .12s forwards}
@keyframes fburst{100%{transform:scale(2.4) rotate(20deg);opacity:0;
  box-shadow:0 0 34px rgba(255,240,180,1)}}
#animQ{position:absolute;right:6px;bottom:8px;z-index:8;display:flex;
  flex-direction:column-reverse;gap:3px;pointer-events:none}
#animQ.hide{display:none}
.qchip{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;gap:1px;background:rgba(45,33,80,.9);border:2px solid #6b4f12;
  box-shadow:0 2px 0 #05040c}
.qchip .qi{font-size:15px}
.qchip .qc{font-size:8px;font-weight:900;color:#8fd0ff}
#animCnt{position:absolute;right:8px;bottom:calc(8px + 176px);z-index:9;
  font-family:"Press Start 2P";font-size:12px;color:#ffe38a;
  text-shadow:0 2px 0 #000;pointer-events:none}
#hand::-webkit-scrollbar{display:none}
.card{flex:0 0 112px;height:138px;border-radius:10px;position:relative;cursor:pointer;isolation:isolate;
  background:radial-gradient(circle at 50% 26%,rgba(143,208,255,.15),transparent 35%),linear-gradient(180deg,#33265a,#18102e);
  border:2px solid #5d4d89;box-shadow:0 4px 0 #05040c,inset 0 0 18px rgba(143,208,255,.06);
  padding:7px 7px;display:flex;flex-direction:column;touch-action:manipulation;
  transition:transform .12s,box-shadow .12s,opacity .12s}
.card:not(.fused)::before{content:"";position:absolute;inset:4px;border:1px solid rgba(226,232,255,.15);border-radius:7px;z-index:-1;pointer-events:none}
.card.playable{border-color:#ecc24e;box-shadow:0 4px 0 #05040c,0 0 14px rgba(236,194,78,.48),inset 0 0 15px rgba(236,194,78,.08)}

.card.dead{opacity:.3;filter:grayscale(.8)}
.card.wild{border-color:#e26bd6;background:linear-gradient(180deg,#3d2150,#241030)}
.card.wild.playable{box-shadow:0 3px 0 #05040c,0 0 13px rgba(226,107,214,.55)}
.card .cost{position:absolute;top:-7px;left:-5px;width:27px;height:27px;border-radius:50%;
  background:linear-gradient(180deg,#8fd0ff,#3f7fd0);border:2px solid #05040c;
  font-family:"Press Start 2P";font-size:11px;color:#05040c;display:flex;align-items:center;justify-content:center}
.card.wild .cost{background:linear-gradient(180deg,#f0a8e8,#a83fc0);color:#fff;font-size:8px}
.card .cn{font-size:13px;font-weight:900;margin:10px 0 3px;line-height:1.25;color:#fff;text-shadow:0 2px 2px #05040c}
.card .ct{font-size:10.5px;line-height:1.42;color:#c9c0df;flex:1}
.card .ct b{color:#ecc24e}.card .ct em{font-style:normal;color:#e26bd6}
.card .badge{font-size:9px;color:#57b6ea;letter-spacing:1px}
.card .rspec{margin-top:2px;padding:2px 3px;border:1px solid currentColor;border-radius:4px;
  font-size:8px;font-weight:900;line-height:1.2;text-align:center;background:rgba(7,5,15,.72)}
.card.rR .rspec{color:#8fd0ff}.card.rL .rspec{color:#ffcf66;text-shadow:0 0 7px rgba(255,179,71,.85)}

/* ================= OVERLAY ================= */
.veil{position:fixed;inset:0;z-index:45;background:rgba(7,5,15,.95);
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.cw{max-width:430px;width:100%;text-align:center}
.cw.quiz-card{width:min(100%,560px);max-width:560px;max-height:calc(100dvh - 24px);
  overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 12px;scrollbar-gutter:stable}
.cw.quiz-card h1{overflow-wrap:anywhere;text-wrap:balance}
.cw.quiz-card #qopts{padding-bottom:max(4px,env(safe-area-inset-bottom))}
.cw.course-wide{max-width:min(1180px,96vw);height:min(900px,92vh);display:flex;flex-direction:column}
.course-viewer{min-height:0;height:100%;display:flex;flex-direction:column;padding:10px;background:#100a20;border:3px solid #6b4f12;border-radius:8px;box-shadow:0 0 26px rgba(236,194,78,.24)}
.course-viewer-head{display:flex;align-items:center;gap:9px;text-align:left;padding:2px 3px 8px}
.course-viewer-head>div{flex:1;min-width:0}.course-viewer-head b{display:block;color:#ffe38a;font-size:15px}.course-viewer-head span{display:block;color:#a99ec9;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-viewer-frame{display:block;flex:1;min-height:0;width:100%;border:2px solid #4a3b73;border-radius:6px;background:#fff}
.course-viewer .course-close{flex:0 0 auto;margin:0;padding:8px 16px;font-size:13px;letter-spacing:1px;box-shadow:0 3px 0 #5a3f0d}
@media(max-width:600px){.veil:has(.course-wide){padding:5px}.cw.course-wide{max-width:100%;height:98vh}.course-viewer{padding:6px}.course-viewer-head b{font-size:12px}.course-viewer-head span{font-size:9px}.course-viewer .course-close{padding:7px 10px;font-size:11px}}
@media(max-width:600px){
  .veil:has(.quiz-card){align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
  .cw.quiz-card{max-height:calc(100dvh - max(16px,calc(env(safe-area-inset-top) + env(safe-area-inset-bottom))));padding-inline:2px;margin:auto}
